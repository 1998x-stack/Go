# Tool settings only: pygame/pygbag continue to run the root main.py directly.
# Packaging metadata can be added after the headless core migration is complete.

[tool.ruff]
target-version = "py39"
line-length = 100
extend-exclude = ["build", "dist"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests", "."]
python_files = ["test_*.py"]
