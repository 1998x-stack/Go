name: Deploy Go game to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deployment at a time.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pygame pygbag

      # Build the playable in-browser bundle with pygbag (outputs build/web).
      - name: Build game with pygbag
        run: python -m pygbag main.py

      # Assemble the static site: rename pygbag's autogenerated page to game.html
      # (so the landing page can iframe it), drop in our landing page, and copy
      # screenshots into the deploy bundle.
      - name: Assemble site bundle
        run: |
          mv build/web/index.html build/web/game.html
          cp web/index.html build/web/index.html
          cp arc.png arch.png build/web/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4