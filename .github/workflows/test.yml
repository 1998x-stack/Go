name: Rules and infrastructure tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Test headless rules engine
        run: python -m unittest discover -p 'test_*.py' -v
      - name: Test headless infrastructure
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Compile all Python source
        run: python -m compileall -q go_game main.py game.py gameboard.py sgf.py ai.py test_*.py tests

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Ruff
        run: python -m pip install 'ruff>=0.9,<1'
      - name: Lint refactored package and entry points
        run: ruff check go_game main.py tests/test_logging.py renderer.py event_handler.py sound.py

  pygame-smoke:
    runs-on: ubuntu-latest
    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pygame
        run: python -m pip install 'pygame>=2.5,<3'
      - name: Import and render using the new package and old compatibility paths
        run: |
          python - <<'PY'
          import pygame
          from game import Game
          from main import main
          from go_game.ui.events import click_to_point
          from go_game.ui.renderer import Renderer
          from renderer import Renderer as LegacyRenderer
          from event_handler import click_to_point as legacy_click_to_point
          from go_game.ui.sound import Sound
          from sound import Sound as LegacySound

          assert callable(main)
          assert Renderer is LegacyRenderer
          assert Sound is LegacySound
          assert click_to_point is legacy_click_to_point
          pygame.init()
          try:
              screen = pygame.display.set_mode((800, 600))
              game = Game()
              render = Renderer(screen, game, (24, 24), 30)
              assert click_to_point(game, (114, 114), (24, 24), 30) == (3, 3)
              render.render('smoke')
              game.finish()
              render.render('score')
              Sound()
          finally:
              pygame.quit()
          PY

  rl-adapters:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install optional Go RL adapter dependencies
        run: python -m pip install 'numpy>=1.26,<3' 'gymnasium>=1.0,<2' 'pettingzoo>=1.25,<2'
      - name: Test Plan A core and optional adapters
        run: python -m unittest -v tests.test_rl_core tests.test_rl_adapters

  selfplay-torch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned CPU PyTorch
        run: python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch==2.5.1'
      - name: Verify Plan B model, search, data, checkpoint and Arena
        run: python -m unittest -v tests.test_training_search tests.test_training_augmentation tests.test_training_torch
      - name: Run end-to-end policy value self-play training smoke
        run: python -m go_game.training.cli --size 2 --simulations 2 --games 1 --steps 1 --pairs 1 --max-moves 100 --output /tmp/go-plan-b-ci
